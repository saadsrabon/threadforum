services:
  postgres:
    image: postgres:16-alpine
    container_name: threadsphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: threadsphere
      POSTGRES_PASSWORD: threadsphere
      POSTGRES_DB: threadsphere
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: threadsphere-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
